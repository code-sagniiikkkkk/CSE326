<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawfecto: Booking</title>
    <link rel="icon" href="logo.png" type="image/x-icon">
    <style>
        .inl{
            display: inline-flex;
        }
        .txtt{
            color:rgb(161, 72, 72);
        }
        *{
            margin:0;
            padding:0;
        }
        .btn{
            background-color: rgb(161, 72, 72);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: box-shadow 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .btn:hover {
            background-color: rgb(228, 227, 227);
            color: rgb(161, 72, 72);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }
        input[type="text"], input[type="tel"] {
            border-radius: 6px;       
            border: 1px solid #ccc;   
            padding: 8px 12px;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color:red;
        }
    </style>
</head>
<body>
    <div id="Home">
        <img src="header-logo.png" width="100%" alt="Pawfecto">
    </div>
    <br>
    <img src="bg3.png" width="100%" alt="Animal bg">
    <div>
        <form align="center" action="pawfecto_home.html">
            <fieldset style="margin: 20px 50px 20px 50px;padding-top:100px;padding-bottom:100px;background-color: rgba(167, 167, 167, 0.585); border-radius: 10px;margin-left:350px;margin-right:350px;">
                <label for="Name" class="txtt">Name:</label>
                <input type="text" id="Name" name="Name" required placeholder="Enter Your Name🐾"><br><br>
                <label for="Phone num" class="txtt">Phone:</label>
                <input type="tel" id="Phone num" name="Phone num" required placeholder="913-847-9374🐾" required minlength="10" maxlength="10"><br><br>
                <label for="appointment">Select date and time:</label>
                <input type="datetime-local" id="appointment" name="appointment" required><br><br>
                <a href="pawfecto_home.html"><input type="submit" value="Book Now" class="btn" onclick="alert('Booking Successfull!')"></a>
                <br>
            </fieldset>
        </form>
    </div>
    <div align="center">
        <footer>
            <address>
                Pawfecto:global &mdash; Headquaters:Phagwara, Punjab &mdash;
                <a href="mailto:fuji.sagnik@gmail.com">info@pawfecto.co.in</a><br>
                Copyrights © 2026 All Rights Reserved by Pawfecto Globals 🐾
            </address>
            
        </footer>
    </div>
</body>
</html>
